<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMT ONE · Showcase Manager</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f6efe0;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px 80px}a{color:#e5c27b}h1{font-size:clamp(1.8rem,4vw,2.8rem)}.panel{background:#181715;border:1px solid #665735;border-radius:20px;padding:22px;margin:20px 0}label{display:block;margin:12px 0;font-weight:650}input,select,textarea{display:block;width:100%;margin-top:6px;background:#0d0d0d;color:white;border:1px solid #75613e;border-radius:10px;padding:12px;font:inherit}textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 18px}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#d5b46e;color:#17120a;font-weight:800;margin:6px 8px 6px 0}.secondary{background:#35302a;color:#fff}.danger{background:#8e3838;color:#fff}.entry{padding:16px 0;border-bottom:1px solid #554b3a;display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap}.muted{color:#bcb3a3}#notice{min-height:24px}</style></head><body><main><a href="/manage.html">← Back to Manage Website</a><h1>Featured Devices, Offers &amp; Launches</h1><p class="muted">Owner controls what customers see. Keep an item hidden until ready. Images can use existing <code>assets/</code> paths or previously uploaded R2 image URLs.</p><p id="notice" role="status"></p><section class="panel"><h2>Add or edit a highlight</h2><form id="editor"><input type="hidden" name="id"><div class="grid"><label>Type<select name="kind"><option value="device">Featured device</option><option value="offer">Special offer</option><option value="launch">New product launch</option><option value="announcement">Shop announcement</option></select></label><label>Title<input name="title" maxlength="120" required placeholder="e.g. Galaxy Z Fold7 arrival"></label><label>Badge<input name="badge" maxlength="40" placeholder="NEW ARRIVAL"></label><label>Price or offer label<input name="price_label" maxlength="80" placeholder="QAR 299 · Limited offer"></label><label>Existing image URL<input name="image" placeholder="assets/phone.jpg or /api/image/..." list="images"></label><label>Link (optional)<input name="link_url" placeholder="/index.html#stock or https://..."></label><label>Display order<input name="sort_order" type="number" min="0" max="9999" value="0"></label><label>Offer expiry (optional)<input name="expires_at" type="date"></label></div><label>Details<textarea name="subtitle" maxlength="400" placeholder="Explain the device, launch or promotion"></textarea></label><label><input name="visible" type="checkbox" style="width:auto;display:inline-block"> Visible to customers</label><button type="submit">Save highlight</button><button type="button" class="secondary" id="reset">New highlight</button></form></section><section class="panel"><h2>Manage highlights</h2><div id="items">Loading…</div></section></main><script src="showcase-manager.js"></script></body></html>
